name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../ha-media-bridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ha-media-bridge
          path: ha-media-bridge.apk

  integration:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test requirements
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  release:
    name: Publish release
    # Every push to main publishes (or updates) the release for the current
    # version, so the APK and the integration are always installable.
    if: github.ref == 'refs/heads/main'
    needs: [apk, integration, hassfest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ha-media-bridge

      - name: Check versions match
        id: version
        run: |
          app=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          integration=$(python3 -c "import json;print(json.load(open('custom_components/media_bridge/manifest.json'))['version'])")
          if [ "$app" != "$integration" ]; then
            echo "App ($app) and integration ($integration) versions differ" >&2
            exit 1
          fi
          echo "name=$app" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: ha-media-bridge.apk
          fail_on_unmatched_files: true
